[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudflow-analytics"
version = "0.1.0"
description = "A local, quality-gated e-commerce analytics pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.4.3",
    "pandas==2.3.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
